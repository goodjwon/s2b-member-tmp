<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원정보입력 | S2B 개인회원 사전가입</title>
<link rel="stylesheet" href="../assets/css/s2b.css">
</head>
<body>
<div class="popup">
  <div class="popup-head">
    <div class="logo"><img src="../assets/img/sub_ci.gif" alt="S2B"><span>행정안전부 고시 제2023-16호<br><img src="../assets/img/ci_s2b_3.gif" alt="교육기관전자조달시스템"></span></div>
  </div>
  <div class="popup-title">개인회원 사전가입</div>
  <!-- [JSP] Struts ActionForm 프로퍼티 = input name. 데모(data-demo)에서는 검증 후 페이지 이동만 하고, 실서비스는 data-demo 제거 후 form.submit() POST.
     action 예: /S2BNCustomer/S2B/member/preJoin/insert.do -->
  <form class="popup-body" id="memberForm" name="memberForm" method="post" action="complete.html" data-demo novalidate>
    <!-- [JSP] 휴대폰인증(KCB) 결과는 세션에 보관하고 hidden 은 화면 표시/전송용. 서버는 hidden 값이 아닌 세션값을 신뢰할 것 -->
    <input type="hidden" name="instType" value="D">   <!-- 기관구분 D:수요기관 S:공급업체 -->
    <input type="hidden" name="instCd"   value="">    <!-- 기관코드/컴퍼니코드 (로그인 세션) -->
    <input type="hidden" name="instNm"   value="">    <!-- 기관명 -->
    <input type="hidden" name="ci"       value="">    <!-- KCB CI (세션 보관 권장) -->
    <input type="hidden" name="agreeYn"  value="N">   <!-- 개인정보수집 동의 여부, 동의 시 JS가 Y 세팅 -->
    <ol class="steps"><li class="done">휴대폰인증</li><li class="on">회원정보입력</li><li>가입완료</li></ol>
    <p class="tit">회원정보입력</p>
    <p class="desc"><span class="txt-red">*</span> 표시는 필수 입력 항목입니다.</p>

    <table class="form-tbl">
      <tr>
        <th>이름<span class="req">*</span></th>
        <td>
          <input type="text" class="inp" name="userNm" value="윤혁" readonly> <!-- [JSP] KCB 인증 결과 이름 ${kcb.name} -->
          <span class="msg">본인인증 결과로 자동입력된 이름입니다.</span>
        </td>
      </tr>
      <tr>
        <th>휴대폰번호<span class="req">*</span></th>
        <td>
          <input type="text" class="inp" name="mobileNo" value="010-8896-0134" readonly> <!-- [JSP] KCB 인증 결과 휴대폰번호 ${kcb.mobileNo} -->
          <span class="msg">본인인증 결과로 자동입력된 휴대폰 번호 입니다.</span>
        </td>
      </tr>
      <tr>
        <th>아이디<span class="req">*</span></th>
        <td>
          <div class="field">
            <input type="text" class="inp" id="userId" name="userId" placeholder="영문+숫자 6~15자" maxlength="15" autocomplete="off" style="max-width:270px">
            <button type="button" class="btn sm" id="btnDup">중복확인</button>
          </div>
          <span class="msg" id="userIdMsg"></span>
        </td>
      </tr>
      <tr>
        <th>비밀번호<span class="req">*</span></th>
        <td>
          <input type="password" class="inp" id="userPw" name="userPw" placeholder="영문+숫자+특수문자 8~20자" maxlength="20" autocomplete="new-password">
          <span class="msg" id="userPwMsg"></span>
        </td>
      </tr>
      <tr>
        <th>비밀번호 확인<span class="req">*</span></th>
        <td>
          <input type="password" class="inp" id="userPw2" name="userPw2" placeholder="위 입력한 비밀번호를 다시 입력해주세요" maxlength="20" autocomplete="new-password">
          <span class="msg" id="userPw2Msg"></span>
        </td>
      </tr>
      <tr>
        <th>이메일<span class="req">*</span></th>
        <td>
          <div class="field">
            <input type="email" class="inp" name="email" data-role="email" placeholder="example@domain.com" autocomplete="off" style="max-width:270px">
            <button type="button" class="btn sm" data-role="btn-send">인증메일 발송</button>
          </div>
          <span class="msg" data-role="email-msg"></span>
          <span class="dev-note hidden" data-role="dev-code"></span> <!-- [JSP] 개발용, 제거 -->
          <div class="hidden" data-role="code-row" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">
            <div class="field">
              <label for="authCode" style="font-weight:600;margin-right:4px">인증코드</label>
              <input type="text" class="inp short" id="authCode" name="authCode" data-role="code" placeholder="이메일로 받은 6자리 코드" maxlength="6" autocomplete="off">
              <span class="timer" data-role="timer"></span>
              <button type="button" class="btn sm primary" data-role="btn-verify">인증</button>
            </div>
            <span class="msg" data-role="code-msg">인증코드는 5분간 유효합니다. 숫자+영문만 입력 가능</span>
          </div>
        </td>
      </tr>
    </table>

    <div class="agree">
      <label><input type="checkbox" id="agree"> 개인정보수집/이용 동의 <span class="txt-red">(필수)</span></label>
      <button type="button" class="btn xs" id="btnPrivacy">보기</button>
      <span class="guide">개인정보수집이용동의 내용 확인은 필수로 <b>보기</b>를 클릭하세요. 내용 확인하시면 자동체크됩니다.</span>
    </div>

    <div class="popup-foot" style="padding-bottom:4px">
      <a href="phone-auth.html" class="btn" id="btnPrev">이전</a>
      <button type="submit" class="btn primary">다음</button>
    </div>
  </form>
</div>

<!-- 개인정보수집/이용 동의 본문 팝업 (내용은 추후 전달 문서로 교체)
     [JSP] 본문은 <jsp:include> 또는 DB 약관 조회 결과로 교체. 하단 스크롤 감지를 위해 .scroll-box 구조는 유지 -->
<template id="privacyTpl">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">개인정보수집/이용 동의 <button type="button" class="close" data-role="btn-close" aria-label="닫기">×</button></div>
    <div class="modal-body">
      <div class="scroll-box">
        <h4>1. 개인정보의 수집·이용 목적</h4>
        <p>S2B(교육기관전자조달시스템)는 개인회원 사전가입 및 신S2B(S2B 2.0) 회원 마이그레이션을 위하여 아래와 같이 개인정보를 수집·이용합니다.</p>
        <p>- 개인회원 식별 및 본인 확인<br>- 소속 기관(수요기관/공급업체) 등록 및 관리<br>- 신S2B 오픈 시 계정 이관 및 권한 설정<br>- 가입 관련 안내 및 고지사항 전달</p>
        <h4>2. 수집하는 개인정보 항목</h4>
        <p>- 필수항목 : 이름, 휴대폰번호, 연계정보(CI), 아이디, 비밀번호, 이메일<br>- 자동수집항목 : 가입일시, 소속 기관정보(기관코드, 기관명)</p>
        <h4>3. 개인정보의 보유 및 이용기간</h4>
        <p>수집된 개인정보는 신S2B 회원정보로 이관되어 회원 탈퇴 시까지 보유·이용됩니다. 다만 관계 법령에 따라 보존할 필요가 있는 경우 해당 법령에서 정한 기간 동안 보관합니다.</p>
        <p>- 계약 또는 청약철회 등에 관한 기록 : 5년<br>- 대금결제 및 재화 등의 공급에 관한 기록 : 5년<br>- 소비자의 불만 또는 분쟁처리에 관한 기록 : 3년</p>
        <h4>4. 동의를 거부할 권리 및 거부 시 불이익</h4>
        <p>이용자는 개인정보 수집·이용에 대한 동의를 거부할 권리가 있습니다. 다만, 필수항목에 대한 동의를 거부할 경우 개인회원 사전가입이 불가하며, 신S2B 그랜드 오픈 이후 계약업무 이용에 제한이 있을 수 있습니다.</p>
        <h4>5. 개인정보의 제3자 제공</h4>
        <p>S2B는 이용자의 개인정보를 제1항에서 고지한 범위 내에서 사용하며, 이용자의 사전 동의 없이 동 범위를 초과하여 이용하거나 원칙적으로 제3자에게 제공하지 않습니다. 다만, 법령의 규정에 의거하거나 수사 목적으로 법령에 정해진 절차와 방법에 따라 수사기관의 요구가 있는 경우는 예외로 합니다.</p>
        <h4>6. 개인정보 처리 위탁</h4>
        <p>- 휴대폰 본인인증 : 코리아크레딧뷰로(주)<br>- 이메일 발송 : 시스템 운영사</p>
        <h4>7. 기타</h4>
        <p>본 동의서에 명시되지 않은 사항은 S2B 개인정보처리방침에 따릅니다. 문의사항은 S2B 고객센터로 연락 주시기 바랍니다.</p>
        <p style="margin-top:20px;color:#999">※ 본 내용은 화면 구성용 임시 문안이며, 확정 문서로 교체 예정입니다.</p>
      </div>
      <p class="scroll-hint">본문 하단까지 스크롤하여 내용을 확인하시면 동의 버튼이 활성화됩니다.</p>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn primary" data-role="btn-agree" disabled>동의</button>
      <button type="button" class="btn" data-role="btn-close">닫기</button>
    </div>
  </div>
</template>

<script src="../assets/js/s2b.js"></script>
<script>
initMemberForm(document.getElementById('memberForm'));
// 이전: 휴대폰인증 페이지로 이동. [JSP] 세션의 KCB 인증정보(CI) 삭제 Action 호출 후 이동 (예: resetAuth.do)
document.getElementById('btnPrev').onclick = function (e) {
  e.preventDefault();
  s2bConfirm('휴대폰인증 화면으로 이동합니다.\n입력한 정보와 인증상태는 초기화됩니다. 이동하시겠습니까?', function () { location.href = 'phone-auth.html'; });
};
</script>
</body>
</html>
