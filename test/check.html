<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>s2b.js self-check</title></head>
<body>
<form id="f" action="ok.html" data-demo>
  <input id="userId"><span id="userIdMsg"></span><button type="button" id="btnDup"></button>
  <input id="userPw"><span id="userPwMsg"></span>
  <input id="userPw2"><span id="userPw2Msg"></span>
  <input data-role="email"><span data-role="email-msg"></span><button type="button" data-role="btn-send"></button>
  <div data-role="code-row" class="hidden"><input data-role="code"><span data-role="code-msg"></span><button type="button" data-role="btn-verify"></button><span data-role="timer"></span></div>
  <span data-role="dev-code" class="hidden"></span>
  <input type="checkbox" id="agree"><button type="button" id="btnPrivacy"></button>
</form>
<template id="privacyTpl"><div class="modal"><div class="scroll-box" style="height:50px;overflow:auto"><div style="height:500px"></div></div><p class="scroll-hint"></p><button data-role="btn-agree" disabled></button><button data-role="btn-close"></button></div></template>
<pre id="out"></pre>
<script src="../assets/js/s2b.js"></script>
<script>
var out=[], fails=0;
function t(name, cond){ out.push((cond?'PASS ':'FAIL ')+name); if(!cond) fails++; }
function inp(el,v){ el.value=v; el.dispatchEvent(new Event('input')); }
function lastAlert(){ var a=document.querySelector('.dim .alert-body'); return a?a.textContent:''; }
function closeAlert(){ var b=document.querySelector('.dim button'); if(b) b.click(); }
var f=document.getElementById('f'); initMemberForm(f);
var id=document.getElementById('userId'), pw=document.getElementById('userPw'), pw2=document.getElementById('userPw2');
var email=f.querySelector('[data-role=email]'), code=f.querySelector('[data-role=code]');

// 아이디
inp(id,'AbC!한 12'); t('아이디 소문자/특수문자/한글/공백 제거', id.value==='abc12');
t('아이디 5자 오류', document.getElementById('userIdMsg').textContent==='아이디 형식이 올바르지 않습니다.');
document.getElementById('btnDup').click(); t('아이디 형식오류시 중복확인 알럿 없음', !document.querySelector('.dim')); 
inp(id,''); document.getElementById('btnDup').click(); t('아이디 미입력 알럿', lastAlert()==='아이디 입력후에 중복확인을 하시기 바랍니다.'); closeAlert();
inp(id,'yh0134'); document.getElementById('btnDup').click(); t('아이디 중복 알럿', lastAlert()==='입력하신 아이디는 이미 사용중인 아이디입니다.'); closeAlert();
inp(id,'newuser01'); document.getElementById('btnDup').click(); t('아이디 정상 알럿', lastAlert()==='사용가능한 아이디입니다.'); closeAlert();
// 비밀번호
inp(pw,'Abcd1234'); t('비번 소문자 전환+특수문자 없음 오류', pw.value==='abcd1234' && pw.classList.contains('err'));
inp(pw,'abcd 12!한'); t('비번 공백/한글 제거', pw.value==='abcd12!');
inp(pw,'abcd123!'); t('비번 정상', document.getElementById('userPwMsg').textContent==='사용 가능한 형식입니다.');
inp(pw2,'abcd123'); t('비번확인 불일치', document.getElementById('userPw2Msg').textContent==='비밀번호가 일치하지 않습니다.');
inp(pw2,'abcd123!'); t('비번확인 일치', document.getElementById('userPw2Msg').textContent==='비밀번호가 일치합니다.');
// 이메일
inp(email,'bad@'); t('이메일 형식 오류', f.querySelector('[data-role=email-msg]').textContent==='올바른 이메일 형식이 아닙니다.');
inp(email,'a@b.co'); t('이메일 정상', f.querySelector('[data-role=email-msg]').textContent==='유효한 형식입니다. 인증메일을 발송해주세요');
var send=f.querySelector('[data-role=btn-send]'), verify=f.querySelector('[data-role=btn-verify]');
send.click(); t('발송 후 코드행 표시/재발송', !f.querySelector('[data-role=code-row]').classList.contains('hidden') && send.textContent==='재발송');
t('타이머 시작', f.querySelector('[data-role=timer]').textContent==='5분 0초');
verify.click(); t('코드 미입력 알럿', lastAlert()==='인증코드 입력후에 인증버튼을 클릭하시기 바랍니다.'); closeAlert();
inp(code,'ab-1'); t('코드 영숫자만+대문자', code.value==='AB1');
inp(code,'ZZZZZZ'); verify.click(); t('코드 불일치 알럿', lastAlert().indexOf('일치하지 않습니다')>-1); closeAlert();
// 다음: 이메일 미인증 상태
f.requestSubmit(); t('다음 - 이메일 미인증 차단', lastAlert()==='이메일 인증을 완료해주세요.'); closeAlert();
var real=f.querySelector('[data-role=dev-code]').textContent.slice(-6);
inp(code,real); verify.click(); t('코드 정상 알럿', lastAlert()==='인증되었습니다.'); closeAlert();
t('인증완료 버튼 비활성', verify.textContent==='인증완료' && verify.disabled);
// 개인정보 동의
var agree=document.getElementById('agree'); agree.click(); t('체크박스 직접 체크 불가 알럿', !agree.checked && lastAlert().indexOf('본문 확인이 필수')>-1); closeAlert();
document.getElementById('btnPrivacy').click();
var box=document.querySelector('.dim .scroll-box'), ag=document.querySelector('.dim [data-role=btn-agree]');
t('스크롤 전 동의 비활성', ag.disabled);
box.scrollTop=9999; box.dispatchEvent(new Event('scroll')); t('하단 스크롤 후 동의 활성', !ag.disabled);
ag.click(); t('동의 클릭시 체크', agree.checked && !document.querySelector('.dim'));
// 다음: 전부 통과 → action 이동 (location 변경은 헤드리스에서 확인만)
var moved=false; f.setAttribute('action','#done'); f.requestSubmit(); t('다음 - 전부 통과시 알럿 없음', !document.querySelector('.dim'));
document.getElementById('out').textContent=out.join('\n')+'\nRESULT: '+(fails?fails+' FAIL':'ALL PASS');
</script></body></html>
